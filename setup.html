{% extends 'base.html' %}
{% block title %}প্রথম সেটআপ{% endblock %}
{% block content %}
<section class="panel narrow">
<h1>প্রথমবার অ্যাডমিন তৈরি করুন</h1>
<p>এই ধাপটি একবারই করতে হবে। শক্তিশালী পাসওয়ার্ড ব্যবহার করুন।</p>
<form method="post">
<input type="hidden" name="_csrf" value="{{csrf_token()}}">
<label>আপনার নাম<input name="name" required maxlength="120"></label>
<label>অ্যাডমিন ইউজারনেম<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label>
<label>পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)<input type="password" name="password" minlength="12" required autocomplete="new-password"></label>
{% if production %}
<label>সেটআপ সিক্রেট কোড<input type="password" name="setup_token" required></label>
{% endif %}
<button class="primary">অ্যাডমিন তৈরি করুন</button>
</form>
</section>
{% endblock %}
